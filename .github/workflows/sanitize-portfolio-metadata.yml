name: Sanitize portfolio metadata

on:
  push:
    branches:
      - portfolio-rebrand
    paths:
      - "src/**/*.java"
      - "test/**/*.java"
      - ".github/workflows/sanitize-portfolio-metadata.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out portfolio branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-rebrand

      - name: Remove student and assessment metadata from JavaDoc
        shell: bash
        run: |
          find src test -type f -name "*.java" -print0 | \
            xargs -0 sed -i -E \
              -e '/^[[:space:]]*\*[[:space:]]*@studentId[[:space:]]+[0-9]+[[:space:]]*$/d' \
              -e '/^[[:space:]]*\*[[:space:]]*@course[[:space:]]+COIT20258 Software Engineering[[:space:]]*$/d'

      - name: Commit sanitized source files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No student metadata remains in the current source tree."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test
          git commit -m "chore: remove student metadata from source headers"
          git push origin portfolio-rebrand
